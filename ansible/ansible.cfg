# Picked up automatically when ansible runs from this directory.
[defaults]
inventory = inventory/generated.yml
roles_path = roles
collections_path = collections
# Use the target's python3 without warning about interpreter discovery.
interpreter_python = auto_silent
# Human-readable task output.
callback_result_format = yaml

[ssh_connection]
# Fewer SSH round trips per task (requires no requiretty in sudoers, the Ubuntu default).
pipelining = True
