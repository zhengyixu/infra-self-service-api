---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    # Skip the refresh if it ran within the last hour: faster, and keeps reruns quiet.
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Set message of the day
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
