# Local AWS emulator for development and CI.
# Image/tag verified against https://github.com/floci-io/floci (pinned for reproducibility).
services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - "4566:4566"
    environment:
      # Hostname Floci embeds in returned URLs (e.g. SQS QueueUrl) for other compose services.
      FLOCI_HOSTNAME: floci
      # memory (default) = clean slate on each restart; switch to "persistent" if needed.
      FLOCI_STORAGE_MODE: memory
    volumes:
      # EC2 instances are real Docker containers launched via the host daemon (needed in Phase 3).
      - /var/run/docker.sock:/var/run/docker.sock
    # Required by Floci to access the Docker socket.
    user: root

  postgres:
    # Source of truth for environments, jobs and the audit outbox (docs/adr/0003).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: infrassa
      POSTGRES_USER: infrassa
      # Local-only default; matches api/src/main/resources/application-floci.yml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrassa_local}
    ports:
      # 15432 on the host: 5432+ is the range apt-installed PostgreSQL clusters use.
      - "15432:5432"
    volumes:
      # PostgreSQL 18 images expect the volume at /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrassa -d infrassa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
